name: Docker Build and push

 #when to  run this flow 

on:
   push:
      branches: [ main ]
   pull_request:
      branches: [ main ]

#define

jobs:
   build-and-push:
       runs-on: ubuntu-latest

       steps:
        #step1 : checkout code
        - name: checkout code
          uses: actions/checkout@v4

        #step2 : set up docker buildx
        - name: Set up  Docker Hub
          uses: docker/setup-buildx-action@v3

        #step3 : login to dockerhub
        - name: Login to docker Hub
          uses: docker/login-action@v3
          with:
             username: ${{ secrets.DOCKER_USERNAME }}
             password: ${{ secrets.DOCKER_PASSWORD }}

        #step4 : build adn push Docker image
        - name: Build and push
          uses: docker/build-push-action@v5
          with:
             context: .
             push: true
             tags: |
                  ${{ secrets.DOCKER_USERNAME }}/system-monitor:latest
                  ${{ secrets.DOCKER_USERNAME }}/system-monitor:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
    
         # Step 5: Image digest
           - name: Image digest
             run: echo "Image pushed successfully!"
